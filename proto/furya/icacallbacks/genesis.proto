syntax = "proto3";
package furya.icacallbacks;

option go_package = "github.com/furysport/furya-chain/x/icacallbacks/types";
import "gogoproto/gogo.proto";
import "furya/icacallbacks/params.proto";
import "furya/icacallbacks/callback_data.proto";

// GenesisState defines the icacallbacks module's genesis state.
message GenesisState {
  Params params = 1 [ (gogoproto.nullable) = false ];
  string port_id = 2;
  repeated CallbackData callback_data_list = 3 [ (gogoproto.nullable) = false ];
}
