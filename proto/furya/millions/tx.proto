syntax = "proto3";
package furya.millions;

import "gogoproto/gogo.proto";
import "amino/amino.proto";

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";

import "furya/millions/draw_schedule.proto";
import "furya/millions/prize_strategy.proto";

option go_package = "github.com/furysport/furya-chain/v2/x/millions/types";

service Msg {
  rpc Credit(MsgCredit) returns (MsgCreditResponse);
  rpc CreditRetry(MsgCreditRetry) returns (MsgCreditRetryResponse);
  rpc CreditEdit(MsgCreditEdit) returns (MsgCreditEditResponse);
  rpc ClaimPrize(MsgClaimPrize) returns (MsgClaimPrizeResponse);
  rpc WithdrawCredit(MsgWithdrawCredit) returns (MsgWithdrawCreditResponse);
  rpc WithdrawCreditRetry(MsgWithdrawCreditRetry)
      returns (MsgWithdrawCreditRetryResponse);
  rpc DrawRetry(MsgDrawRetry) returns (MsgDrawRetryResponse);
  rpc RestoreInterchainAccounts(MsgRestoreInterchainAccounts)
      returns (MsgRestoreInterchainAccountsResponse);
  rpc GenerateSeed(MsgGenerateSeed) returns (MsgGenerateSeedResponse);
}

message MsgUpdateParams {
  option (amino.name) = "furya/millions/MsgUpdateParams";

  string min_credit_amount = 1 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = true
  ];
  string max_prize_strategy_batches = 2 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = true
  ];
  string max_prize_batch_quantity = 3 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = true
  ];
  google.protobuf.Duration min_draw_schedule_delta = 4
      [ (gogoproto.stdduration) = true, (gogoproto.nullable) = true ];
  google.protobuf.Duration max_draw_schedule_delta = 5
      [ (gogoproto.stdduration) = true, (gogoproto.nullable) = true ];
  google.protobuf.Duration prize_expiration_delta = 6
      [ (gogoproto.stdduration) = true, (gogoproto.nullable) = true ];
  string fees_stakers = 7 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = true
  ];
  google.protobuf.Duration min_credit_draw_delta = 8
      [ (gogoproto.stdduration) = true, (gogoproto.nullable) = true ];
  string updater_address = 9 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgUpdateParamsResponse {}

message MsgRegisterPool {
  option (amino.name) = "furya/millions/MsgRegisterPool";

  string chain_id = 1;
  string denom = 2;
  string native_denom = 3;
  string connection_id = 4;
  repeated string validators = 5;
  string min_credit_amount = 6 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = false
  ];
  DrawSchedule draw_schedule = 7 [ (gogoproto.nullable) = false ];
  PrizeStrategy prize_strategy = 8 [ (gogoproto.nullable) = false ];
  string bech32_prefix_acc_addr = 9;
  string bech32_prefix_val_addr = 10;
  string creator_address = 11
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgRegisterPoolResponse { uint64 pool_id = 1; }

message MsgUpdatePool {
  option (amino.name) = "furya/millions/MsgUpdatePool";

  uint64 pool_id = 1;
  repeated string validators = 2 [ (gogoproto.nullable) = true ];
  string min_credit_amount = 3 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = true
  ];
  DrawSchedule draw_schedule = 4 [ (gogoproto.nullable) = true ];
  PrizeStrategy prize_strategy = 5 [ (gogoproto.nullable) = true ];
  string updater_address = 6 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgUpdatePoolResponse {}

message MsgCredit {
  option (amino.name) = "furya/millions/MsgCredit";

  uint64 pool_id = 1;
  cosmos.base.v1beta1.Coin amount = 2 [ (gogoproto.nullable) = false ];
  string creditor_address = 3
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string winner_address = 4 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bool is_sponsor = 5;
}

message MsgCreditResponse { uint64 credit_id = 1; }

message MsgCreditRetry {
  option (amino.name) = "furya/millions/MsgCreditRetry";

  uint64 pool_id = 1;
  uint64 credit_id = 2;
  string creditor_address = 3
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgCreditEdit {
  option (amino.name) = "furya/millions/MsgCreditEdit";

  uint64 pool_id = 1;
  uint64 credit_id = 2;
  string winner_address = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  google.protobuf.BoolValue is_sponsor = 4;
  string creditor_address = 5
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgCreditEditResponse {}

message MsgCreditRetryResponse {}

message MsgClaimPrize {
  option (amino.name) = "furya/millions/MsgClaimPrize";

  uint64 pool_id = 1;
  uint64 draw_id = 2;
  uint64 prize_id = 3;
  string winner_address = 4 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgClaimPrizeResponse {}

message MsgWithdrawCredit {
  option (amino.name) = "furya/millions/MsgWithdrawCredit";

  uint64 pool_id = 1;
  uint64 credit_id = 2;
  string creditor_address = 3
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string to_address = 4 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgWithdrawCreditResponse { uint64 withdrawal_id = 1; }

message MsgWithdrawCreditRetry {
  option (amino.name) = "furya/millions/MsgWithdrawCreditRetry";

  uint64 pool_id = 1;
  uint64 withdrawal_id = 2;
  string creditor_address = 3
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgWithdrawCreditRetryResponse {}

message MsgDrawRetry {
  option (amino.name) = "furya/millions/MsgDrawRetry";

  uint64 pool_id = 1;
  uint64 draw_id = 2;
  string draw_retry_address = 3
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgDrawRetryResponse {}

message MsgRestoreInterchainAccounts {
  option (amino.name) = "furya/millions/MsgRestoreInterchainAccounts";

  uint64 pool_id = 1;
  string restorer_address = 2
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgRestoreInterchainAccountsResponse {}

message MsgGenerateSeed {
  option (amino.name) = "furya/millions/MsgGenerateSeed";

  string requester_address = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgGenerateSeedResponse { int64 seed = 1; }