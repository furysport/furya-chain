syntax = "proto3";
package furya.millions;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/furysport/furya-chain/v2/x/millions/types";

enum CreditState {
  option (gogoproto.goproto_enum_prefix) = true;

  CREDIT_STATE_UNSPECIFIED = 0
      [ (gogoproto.enumvalue_customname) = "Unspecified" ];
  CREDIT_STATE_IBC_TRANSFER = 1
      [ (gogoproto.enumvalue_customname) = "IbcTransfer" ];
  CREDIT_STATE_ICA_DELEGATE = 2
      [ (gogoproto.enumvalue_customname) = "IcaDelegate" ];
  CREDIT_STATE_SUCCESS = 3 [ (gogoproto.enumvalue_customname) = "Success" ];
  CREDIT_STATE_FAILURE = 4 [ (gogoproto.enumvalue_customname) = "Failure" ];
}

message Credit {
  uint64 pool_id = 1;
  uint64 credit_id = 2;

  CreditState state = 3;
  CreditState error_state = 4;

  string creditor_address = 5
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin amount = 6 [ (gogoproto.nullable) = false ];

  string winner_address = 7 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bool is_sponsor = 8;
  reserved 9;

  int64 created_at_height = 10;
  int64 updated_at_height = 11;
  google.protobuf.Timestamp created_at = 12
      [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
  google.protobuf.Timestamp updated_at = 13
      [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
}
